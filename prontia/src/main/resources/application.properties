spring.application.name=prontia
server.port=8080

# Ollama (ambiente local de testes)
prontia.ollama.base-url=http://localhost:11434
prontia.ollama.model=qwen3:1.7b
prontia.ollama.temperature=0.2
prontia.ollama.connect-timeout=3s
prontia.ollama.read-timeout=60s

spring.datasource.url=jdbc:postgresql://localhost:5432/prontia
spring.datasource.username=${DB_USER:prontia}
spring.datasource.password=${DB_PASSWORD:prontia}

# Só para desenvolvimento. Depois trocamos por Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Estabelecimento usado enquanto não há identificação pelo n8n
prontia.estabelecimento-padrao=barbearia-prime